<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIAM Universitas Mulia</title>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#10262c;--mut:#5d7279;--line:#dde6e8;--pri:#0f7b86;--pri2:#0a5e67;--soft:#e2f2f3;--acc:#f0a92e;--side:#0c2a31;--stx:#bcd4d8;--bad:#c93a3a;--ok:#1d8a4b;--warn:#fff4dc;--wtx:#7a5200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a181c;--card:#122a30;--ink:#e6f1f2;--mut:#93abb0;--line:#244046;--soft:#15434a;--pri:#2bb3c0;--pri2:#5fd0da;--warn:#3a2d10;--wtx:#f3cf85}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:50;background:var(--side);color:#fff;display:flex;align-items:center;gap:8px;padding:0 24px;height:66px;box-shadow:0 2px 14px #0004}
.brand{display:flex;gap:12px;align-items:center;margin-right:18px;color:#fff;cursor:pointer;flex:none}
.mark{width:44px;height:44px;border-radius:12px;background:#fff center/86% no-repeat;box-shadow:0 2px 8px #0003;flex:none}
.brand b{display:block;font-size:18px;letter-spacing:.3px;line-height:1.1}
.brand small{opacity:.7;font-size:12px}
.tn{display:flex;align-items:center;gap:2px;flex:1;min-width:0;height:100%}
.dd{position:relative;height:100%;display:flex;align-items:center}
.cat{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--stx);font:600 14.5px inherit;padding:0 14px;height:42px;border-radius:10px;cursor:pointer;white-space:nowrap}
.cat:hover{background:#ffffff14;color:#fff}
.cat.act{background:#ffffff1f;color:#fff}
.cat.act svg.i{color:var(--acc)}
.chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.7;transition:.2s}
.cat[aria-expanded=true] .chev{transform:rotate(-135deg) translateY(-2px)}
.pn{position:absolute;left:0;top:calc(100% - 8px);min-width:292px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #0004;padding:8px;z-index:60}
.dd:nth-last-child(-n+2) .pn{left:auto;right:0}
.sub{max-height:124px;overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.sub a{display:flex;align-items:center;height:40px;padding:0 12px;border-radius:8px;color:var(--ink);cursor:pointer;font-size:14px}
.sub a:hover{background:var(--soft)}
.sub a.on{background:var(--acc);color:#2a1d00;font-weight:700}
.grp{padding:0}
.sub a.gh{justify-content:space-between;width:100%}
.gh .chev{color:var(--mut)}
.gh[aria-expanded=true] .chev{transform:rotate(-135deg) translateY(-2px)}
.gh.ing{color:var(--pri);font-weight:700}
.pills{display:flex;gap:6px;padding:2px 4px 8px}
.pills a{flex:1;height:32px;justify-content:center;border:1px solid var(--line);padding:0 8px;font-size:13px}
.hint{font-size:11.5px;color:var(--mut);padding:6px 12px 2px;border-top:1px solid var(--line);margin-top:6px}
.tr{display:flex;gap:8px;margin-left:auto;flex:none}
.ib{display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff26;color:#fff;border-radius:10px;padding:8px 14px;font:600 14px inherit;cursor:pointer}
.ib:hover{background:#ffffff26}
.burger{display:none;background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;width:40px;height:40px;color:#fff;cursor:pointer;place-items:center}
.crumb{color:var(--mut);font-size:14px;padding:20px 28px 0;max-width:1180px}
.crumb b{color:var(--ink)}
.page{padding:28px;max-width:1180px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;letter-spacing:-.3px}
.lead{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:20px;overflow:hidden}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card h2{margin:0;font-size:16px}
.cb{padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat span{display:block;color:var(--mut);font-size:13px}
.stat b{font-size:28px;letter-spacing:-.5px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}
.two .card{margin:0}
.car{position:relative;overflow:hidden}
.sl{display:flex;transition:transform .4s}
.sl>div{min-width:100%;padding:2px 4px 0}
.sl h3{margin:0 0 6px;font-size:16px}
.sl p{margin:0;color:var(--mut)}
.dots{display:flex;gap:6px;align-items:center;margin-top:16px}
.dots button{width:8px;height:8px;border-radius:8px;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{width:22px;background:var(--pri)}
.note{background:var(--warn);color:var(--wtx);border-color:transparent}
.note .cb{display:flex;gap:12px;align-items:flex-start}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{border:1px solid var(--line);border-radius:14px;padding:16px}
.pc h4{margin:0 0 10px;font-size:14px;line-height:1.35;min-height:38px}
.meter{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri);border-radius:8px}
.pc .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:8px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--ink)}
.chip.b{background:#f9dcdc;color:#8d1f1f}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--soft);text-align:left;padding:12px 14px;font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line)}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.dts{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;font-size:14px;color:var(--mut)}
.ft{font-size:13px;color:var(--mut);margin-top:12px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:2px solid var(--soft)}
.fm{display:grid;grid-template-columns:200px 1fr;gap:14px 18px;align-items:center}
.fm input,.fm select,.fm textarea{width:100%}
.fm .r{display:flex;gap:10px}
.act{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 20px;font:700 14px inherit;cursor:pointer}
.btn:hover{background:var(--pri2)}
.btn.g{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--pri)}
.btn.w{background:var(--acc);color:#2a1d00}
.x{background:#fbe3e3;color:var(--bad);border:0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
.seg a{padding:8px 18px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut)}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.al{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:10px;align-items:flex-start}
.al.ok{background:#e1f4e8;color:#17653a}.al.no{background:#fbe3e3;color:#8d1f1f}.al.in{background:var(--soft)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.sum{display:inline-flex;gap:28px;background:var(--soft);padding:14px 20px;border-radius:12px;font-weight:700;margin-top:16px;flex-wrap:wrap}
.pinw{max-width:360px;margin:6px auto;text-align:center}
.pinw svg.i{width:38px;height:38px;color:var(--pri)}
.pdots{display:flex;gap:12px;justify-content:center;margin:18px 0 8px}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}
.pdots i.f{background:var(--pri)}
.pm{min-height:22px;color:var(--bad);font-size:14px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pk button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 20px inherit;cursor:pointer}
.pk button:hover{background:var(--soft)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bt{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto}
.bt a{padding:11px 18px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.bt a:hover{color:var(--ink)}
.bt a.on{color:var(--pri);border-bottom-color:var(--pri)}
.bl{display:grid;grid-template-columns:240px 1fr;margin:0}
.bl dt,.bl dd{margin:0;padding:13px 4px;border-bottom:1px solid var(--line);word-break:break-word}
.bl dt{color:var(--mut)}
.bl>:nth-last-child(-n+2){border-bottom:0}
.bl dd.ok{color:var(--ok);font-weight:700}
.bl dd input{width:100%;max-width:520px}
.sp{position:relative;display:inline-flex}
.sp .btn:first-child{border-radius:10px 0 0 10px}
.sp .btn+.btn{border-radius:0 10px 10px 0;border-left:0;padding:10px 12px;display:grid;place-items:center}
.sm{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0003;padding:6px;z-index:20}
.sm a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.sm a:hover,.sm a:focus{background:var(--soft);outline:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bl dd.ok{color:#5fd68c}}
@media(max-width:760px){.bl{grid-template-columns:1fr}.bl dt{border-bottom:0;padding-bottom:0;font-size:13px}.bl dd{padding-top:4px}}
@media print{.top,.crumb,.noprint,.tg,.lead{display:none!important}body{background:#fff}.card{border:0}.page{padding:0}}
.ann{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.an{border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex:none}
.an h3{margin:0 0 4px;font-size:15px}
.an p{margin:0;color:var(--mut)}
.an p.clamp{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lk{background:none;border:0;color:var(--pri);font:700 13.5px inherit;padding:8px 0 0;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px 34px;margin-bottom:20px;color:#fff;background:linear-gradient(120deg,#0c2a31 0%,#0f7b86 62%,#2bb3c0 100%);display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#f0a92e55,transparent 70%)}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:27px;max-width:580px;margin:12px 0 8px}
.hero p{margin:0;opacity:.85;max-width:520px}
.eyebrow{display:inline-block;background:#ffffff24;padding:4px 14px;border-radius:20px;font-size:13px}
.hero svg.art{flex:none;width:210px;height:146px;animation:flt 5s ease-in-out infinite}
.hero{background-size:180% 180%;animation:gs 14s ease infinite;box-shadow:0 14px 34px #0f7b8630;padding:34px 38px}
.hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1.4px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);mask-image:linear-gradient(90deg,transparent 35%,#000);pointer-events:none}
.hero h1{font-size:30px;letter-spacing:-.3px;max-width:640px}
.hero .rl{font-size:17px;font-weight:700;color:#ffd98a;opacity:1;margin:0 0 14px}
.wv{display:inline-block;transform-origin:70% 70%;animation:wv 2.4s ease-in-out infinite}
.hc{display:flex;gap:8px;flex-wrap:wrap}
.hc span{background:#ffffff1f;border:1px solid #ffffff33;backdrop-filter:blur(4px);padding:5px 13px;border-radius:20px;font-size:12.5px;font-weight:600}
.hc span.on{background:#1d8a4b55;border-color:#5fd68c88;color:#d6ffe4}
.qh{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:4px 2px 10px}
.qa button{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 92%,currentColor))}
.qa button:hover i{transform:scale(1.12) rotate(-4deg)}
.qa i{transition:transform .25s}
.qa button,.card{animation:fu .5s both}
.qa button:nth-child(2){animation-delay:.05s}.qa button:nth-child(3){animation-delay:.1s}.qa button:nth-child(4){animation-delay:.15s}.qa button:nth-child(5){animation-delay:.2s}.qa button:nth-child(6){animation-delay:.25s}
@keyframes gs{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes flt{50%{transform:translateY(-8px)}}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:760px){.hero h1{font-size:23px}.hero{padding:24px 20px}}
@media(prefers-reduced-motion:reduce){.hero,.hero svg.art,.wv,.qa button,.card{animation:none}}
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink);font:600 13.5px inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.qa button:hover{transform:translateY(-3px);border-color:var(--pri);box-shadow:0 10px 22px #0f7b8624}
.qa i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 15%,transparent)}
.qa i svg.i{width:23px;height:23px}
.an{display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--c,var(--acc));background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--acc)) 9%,transparent),transparent 55%);transition:transform .2s,box-shadow .2s}
.an:hover{transform:translateX(3px);box-shadow:0 8px 20px #0f7b8618}
.anI{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.anI svg.i{width:21px;height:21px}
.anB{min-width:0;flex:1}
.anT{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 9px;border-radius:20px;margin-bottom:6px}
.an h3{font-size:15.5px}
.anD{margin-left:8px;font-size:12px;color:var(--mut)}
@media(max-width:1023px){.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.hero{padding:22px 20px}.hero svg.art{display:none}.hero h1{font-size:22px}}
.mr{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.mr:first-child{border-top:0}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,currentColor 14%,transparent)}
.mb{flex:1;min-width:0}
.mb b{display:block}
.mm{color:var(--mut);font-size:13px}
.ma{flex:none}
.btn.lnk{text-decoration:none;display:inline-block}
.mf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.mr{flex-wrap:wrap}.ma{width:100%}.ma .btn{width:100%;text-align:center}}
.jr{display:flex;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.jr:first-child{border-top:0}
.jt{width:64px;text-align:center;flex:none;line-height:1.25}

.jb{flex:1;min-width:200px}

.jr.sel{opacity:.62}
.st{padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st.a{background:color-mix(in srgb,#1d8a4b 20%,transparent);color:#25a85c}
.st.b{background:var(--soft);color:var(--ink)}
.st.c{background:var(--line);color:var(--mut)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#25a85c;margin-right:7px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.mr.sel{opacity:.62}
.btn.gr{background:#2f9e4f}
.btn.gr:hover{background:#25813f}
tbody th.hr{background:color-mix(in srgb,var(--soft) 60%,transparent);font-weight:600;vertical-align:middle;border-top:1px solid var(--line)}
td{vertical-align:middle}

function bMenu(b){var m=document.getElementById("bsm");if(!m)return;m.hidden=!m.hidden;b.setAttribute("aria-expanded",String(!m.hidden))}
function bClose(){var m=document.getElementById("bsm");if(m&&!m.hidden){m.hidden=true;var b=m.previousElementSibling;if(b)b.setAttribute("aria-expanded","false")}}
document.addEventListener("click",function(e){if(!e.target.closest(".sp"))bClose()});
document.addEventListener("keydown",function(e){if(e.key=="Escape")bClose()});
function bSave(){var rows=BIO[st.bt],o={};
 for(var i=0;i<rows.length;i++){var r=rows[i];if(!r[2])continue;var el=document.getElementById("bf_"+r[1]);if(!el)continue;var v=el.value.trim();
  if(r[1]=="ep"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return toast("Format email personal tidak valid");
  if(r[1]=="tel"&&v&&!/^[0-9+\s-]{8,16}$/.test(v))return toast("Nomor telepon tidak valid");
  o[r[1]]=v||"-"}
 for(var k in o)BD[k]=o[k];st.be=false;toast("Biodata berhasil disimpan");go("bio")}
async function kDl(){try{var d=window.claude&&await claude.use("downloads");if(!d)return toast("Unduhan tidak tersedia di tampilan ini");var b=atob(KAL.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);await d.save({filename:"Kalender_Akademik_2026-2027.jpg",data:new Blob([a],{type:"image/jpeg"})});toast("Kalender akademik diunduh")}catch(e){toast(e&&e.code=="declined"?"Unduhan dibatalkan":"Unduhan gagal")}}
function kpSave(){var g=function(i){return document.getElementById(i).value.trim()},ins=g("kp_i"),jud=g("kp_j"),pl=g("kp_p"),bA=g("kp_ba"),tA=g("kp_ta"),bB=g("kp_bb"),tB=g("kp_tb");
 if(!ins||!jud||!pl)return toast("Lengkapi instansi, judul KP, dan pembimbing lapangan");
 var n=(+tB-+tA)*12+MONS.indexOf(bB)-MONS.indexOf(bA)+1;
 if(n<1)return toast("Waktu akhir KP harus setelah waktu awal");
 st.kpd={ins:ins,jud:jud,pl:pl,bA:bA,tA:tA,bB:bB,tB:tB,lama:n+" bulan"};st.kpe=false;st.kpv=false;toast("Data KP berhasil disimpan. Klik Lihat Rekapan untuk melihatnya.");go("kp")}
function kpUbah(){st.kpe=true;st.kpv=false;go("kp")}
function kpLihat(){st.kpv=true;st.kpe=false;go("kp")}
function kpBack(){st.kpv=false;st.kpe=false;go("kp")}

 st.nfail++;
 if(st.nfail>=5){st.nfail=0;st.nuntil=Date.now()+30000;nerMsg("Password salah 5 kali. Coba lagi dalam 30 detik.")}

}
